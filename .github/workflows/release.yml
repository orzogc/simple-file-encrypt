# Release: a pushed v* tag first runs the complete CI suite (ci.yml as
# a reusable workflow); only then are the release archives built and
# published. Actions are pinned to full commit SHAs, as in ci.yml.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          # The same runners the test jobs use, so release binaries are
          # built on exactly the tested platforms. Linux is linked
          # statically with musl (covered by ci.yml's musl job) so the
          # archive runs on any distribution; musl C compilation uses
          # the zig shims in ci/.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            shim: zigcc-x86_64-linux-musl.sh
            cc_env: CC_x86_64_unknown_linux_musl
            linker_env: CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            shim: zigcc-aarch64-linux-musl.sh
            cc_env: CC_aarch64_unknown_linux_musl
            linker_env: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        # SHA-256-pinned toolchain download: this job holds attestation
        # credentials, and provenance cannot vouch for a compromised
        # compiler (see the action for the pinning rationale).
      - uses: ./.github/actions/setup-zig
        if: contains(matrix.target, 'linux-musl')
      - name: Tag must match the crate version
        run: |
          crate_version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$crate_version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${crate_version}"
            exit 1
          fi
      - name: Build
        run: |
          if [ -n "${{ matrix.cc_env }}" ]; then
            export "${{ matrix.cc_env }}=${{ github.workspace }}/ci/${{ matrix.shim }}"
            export "${{ matrix.linker_env }}=${{ github.workspace }}/ci/${{ matrix.shim }}"
          fi
          cargo build --release --locked --target "${{ matrix.target }}"
      - name: Package
        run: |
          set -euo pipefail
          stage="simple-file-encrypt-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/simple-file-encrypt" "$stage/"
          strip "$stage/simple-file-encrypt"
          cp README.md LICENSE "$stage/"
          tar -czf "${stage}.tar.gz" "$stage"
          if command -v sha256sum >/dev/null; then
            sha256sum "${stage}.tar.gz" > "${stage}.tar.gz.sha256"
          else
            shasum -a 256 "${stage}.tar.gz" > "${stage}.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: simple-file-encrypt-${{ matrix.target }}
          path: |
            simple-file-encrypt-*.tar.gz
            simple-file-encrypt-*.tar.gz.sha256
          retention-days: 1
        # Keyless (Sigstore) build provenance: consumers can verify the
        # archives came from this repo's release.yml on this tag.
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: simple-file-encrypt-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: simple-file-encrypt-*
          merge-multiple: true
      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            simple-file-encrypt-*.tar.gz simple-file-encrypt-*.tar.gz.sha256
