# Dependency updates: Cargo crates and the pinned GitHub Actions.
# See https://docs.github.com/en/code-security/how-tos/secure-your-supply-chain/secure-your-dependencies/configure-version-updates
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    ignore:
      # These direct deps exist only to unify zeroize features with
      # aes-siv's transitive versions; they must move in lockstep with
      # aes-siv (manually), never independently.
      - dependency-name: aes
      - dependency-name: cmac
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
