# Installs the Zig toolchain (musl C compiler for the zigcc shims in
# ci/) and cargo-zigbuild. The archive's SHA-256 is pinned here — from
# ziglang.org/download/index.json at pin time — and verified before
# unpacking: build provenance can only attest what the workflow built,
# not that the toolchain itself was authentic, so toolchain integrity
# must be anchored in the repository. cargo-zigbuild is then bound to
# the verified binary: left alone it runs `python3 -m ziglang` whenever
# the runner's Python provides that module, and the zig on PATH only
# otherwise. Unpacking stays in the runner's temp directory; no root
# involved.
name: Setup zig and cargo-zigbuild
description: Install the SHA-256-pinned Zig toolchain and cargo-zigbuild for musl builds

runs:
  using: composite
  steps:
    - name: Install zig (SHA-256 pinned)
      shell: bash
      run: |
        set -euo pipefail
        version=0.17.1
        case "${RUNNER_ARCH}" in
          X64)   zarch=x86_64;  sha256=3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a ;;
          ARM64) zarch=aarch64; sha256=a1546d5646eb184437918d6635ca6b762a0e889eac09cef720ee7a1ed3fe7795 ;;
          *) echo "unsupported runner architecture: ${RUNNER_ARCH}" >&2; exit 1 ;;
        esac
        archive="zig-${zarch}-linux-${version}.tar.xz"
        curl -sSfL -o "${RUNNER_TEMP}/${archive}" \
          "https://ziglang.org/download/${version}/${archive}"
        echo "${sha256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
        tar -xJf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"
        zig_dir="${RUNNER_TEMP}/zig-${zarch}-linux-${version}"
        actual="$("${zig_dir}/zig" version)"
        if [ "${actual}" != "${version}" ]; then
          echo "unpacked zig reports version ${actual}, expected ${version}" >&2
          exit 1
        fi
        echo "${zig_dir}" >> "${GITHUB_PATH}"
        # cargo-zigbuild's documented overrides: use exactly this zig,
        # and point its Python lookup at nothing so the `ziglang` probe
        # cannot win. A missing zig path is an error, not a fallback.
        {
          echo "CARGO_ZIGBUILD_ZIG_PATH=${zig_dir}/zig"
          echo "CARGO_ZIGBUILD_PYTHON_PATH=/nonexistent"
        } >> "${GITHUB_ENV}"
    - name: Install cargo-zigbuild
      shell: bash
      run: cargo install cargo-zigbuild --locked --version 0.24.1
      # Negative control for the binding: with the zig override pointing
      # nowhere the wrapper must fail. If it succeeds, some other zig is
      # reachable (say, after a cargo-zigbuild update changed the
      # lookup) and the SHA-256 pin no longer decides what compiles.
    - name: cargo-zigbuild resolves only the pinned zig
      shell: bash
      run: |
        set -euo pipefail
        cargo-zigbuild zig cc -- --version
        echo "negative control, 'Failed to find zig' is the expected outcome:"
        if CARGO_ZIGBUILD_ZIG_PATH="${RUNNER_TEMP}/no-such-zig" cargo-zigbuild zig cc -- --version; then
          echo "cargo-zigbuild found a zig other than the pinned one" >&2
          exit 1
        fi
