# cargo-deny policy: dependency advisories, licenses, bans, sources.
# Reference: https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "warn"
# The normal dependency graph carries one version of everything: the
# RustCrypto stack (aes-siv, argon2) and rand share getrandom 0.4 and
# rand_core 0.10. proptest's rand 0.9 line is dev-only, which this
# check ignores by default (multiple-versions-include-dev), so no
# skips are needed.

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
