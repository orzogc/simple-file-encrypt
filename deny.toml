# cargo-deny policy: dependency advisories, licenses, bans, sources.
# Reference: https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "warn"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
