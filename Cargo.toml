[package]
name = "simple-encrypt"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Encrypt and decrypt local files in place with a single password, producing git-friendly (line-diffable, deterministic) ciphertext"
repository = "https://github.com/orzogc/simple-encrypt"

[dependencies]
aes-siv = "0.7.0"
argon2 = { version = "0.5.3", features = ["zeroize"] }
base64 = "0.23.0"
blake3 = "1.8.5"
clap = { version = "4.6.4", features = ["derive"] }
libc = "0.2.189"
rand = "0.10.2"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
zeroize = "1.9.0"

# Not used directly: feature unification makes the CMAC state (and, on
# aarch64, the AES round keys) inside aes-siv zeroize on drop.
cmac = { version = "0.7", features = ["zeroize"] }
aes = { version = "0.9", features = ["zeroize"] }

[dev-dependencies]
assert_cmd = "2.2.2"
proptest = "1.11.0"
tempfile = "3.27.0"

[profile.release]
lto = true

[lints.rust]
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs_dep)'] }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[lints.clippy]
#alloc_instead_of_core = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
doc_markdown = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
#needless_lifetimes = "allow"
nonstandard_macro_braces = "warn"
print_stderr = "warn"
print_stdout = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
ref_as_ptr = "warn"
semicolon_if_nothing_returned = "warn"
#std_instead_of_core = "allow"
#std_instead_of_alloc = "warn"
#too_long_first_doc_paragraph = "allow"
#too_many_arguments = "allow"
#type_complexity = "allow"
undocumented_unsafe_blocks = "warn"
unwrap_or_default = "warn"
